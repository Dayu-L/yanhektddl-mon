<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 延河课堂 DDL</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icon256.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/app.css">
<style>
@layer page {
  body {
    display: grid; grid-template-columns: minmax(0, 600px); justify-content: center;
    align-content: safe start; min-height: 100dvh; padding: 32px 24px 48px;
  }
  .card { width: 100%; border-radius: 12px; padding: 32px 36px 28px; }

  .topbar { display: flex; align-items: center; margin-block-end: 16px; }
  .back {
    display: inline-flex; align-items: center; gap: 5px;
    height: 30px; padding-inline: 12px;
    background: var(--surface); border: 1px solid var(--control); border-radius: 8px;
    font-size: 13px; line-height: 1; text-decoration: none;
    transition: background-color .12s ease, border-color .12s ease;
    &:hover { background: #f5f6f8; border-color: #c3c8d0; }
  }

  h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }

  section {
    padding-block: 22px; border-block-start: 1px solid var(--border);
    &:first-of-type { padding-block-start: 24px; border-block-start: none; }
  }
  .row { display: flex; align-items: flex-start; gap: 16px; }
  .row .grow { flex: 1; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 登录状态标题行:两个按钮在右侧,窄屏整体换行,别把说明文字挤成竖排 */
  .srow { flex-wrap: wrap; }
  .srow .actions { margin-inline-start: auto; }
  .label { font-size: 15px; font-weight: 600; line-height: 22px; }
  .hint { margin-block-start: 3px; color: var(--muted); font-size: 12px; line-height: 1.65; }

  /* 登录状态:三路数据源各一行,左侧圆点表示结论 */
  .sources { display: grid; gap: 8px; margin-block-start: 14px; }
  .source {
    display: grid; grid-template-columns: 8px minmax(0, 1fr) auto;
    align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    & .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--control);
    }
    & .s-main { min-width: 0; }
    & .s-name { font-size: 13px; font-weight: 600; }
    & .s-tag {
      margin-inline-start: 6px; padding: 0 5px; border-radius: 4px;
      background: var(--raised); color: var(--muted);
      font-size: 11px; font-weight: 500;
    }
    & .s-why {
      margin-block-start: 1px; color: var(--faint); font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    & .s-side { display: flex; align-items: center; gap: 8px; }
    & .s-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
    /* 行内登录按钮:比常规 ghost 按钮小一号,不把行高抬起来 */
    & .s-login { height: 26px; padding-inline: 10px; }
    &.ok {
      & .dot { background: var(--positive); }
      & .s-state { color: var(--positive); }
    }
    &.bad {
      & .dot { background: var(--negative); }
      & .s-state { color: var(--negative); }
    }
    &.pending {
      & .dot { background: var(--data-hue); }
      & .s-state { color: var(--data-hue); }
    }
  }

  /* 开关:隐藏原生 checkbox 的外观但保留焦点与键盘操作 */
  .switch {
    position: relative; flex: none; width: 46px; height: 26px; margin-block-start: 2px;
    & input { position: absolute; width: 0; height: 0; opacity: 0; }
    & .slider {
      position: absolute; inset: 0; border-radius: 999px;
      background: #cfd4db; transition: background .18s; cursor: pointer;
      &::before {
        content: ""; position: absolute; left: 3px; top: 3px;
        width: 20px; height: 20px; border-radius: 50%; background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .18s;
      }
    }
    & input:checked + .slider { background: var(--data-hue); }
    & input:checked + .slider::before { transform: translateX(20px); }
    & input:focus-visible + .slider { outline: 2px solid var(--data-hue); outline-offset: 2px; }
  }

  /* 固定检测时间:关闭自动检测时整体变灰,时间输入禁用 */
  .timeRow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    margin-block-start: 16px; padding: 12px 14px;
    background: #f7f8fa; border: 1px solid var(--border); border-radius: 8px;
    transition: opacity .18s;
    &.off { opacity: .45; }
    & label { font-size: 13px; font-weight: 600; }
    & .hint { margin: 0; }
  }
  input[type="time"] {
    height: 34px; padding-inline: 10px;
    background: #fff; border: 1px solid var(--control); border-radius: 7px;
    font-size: 14px;
    &:disabled { background: #f1f2f4; color: var(--faint); }
  }

  /* 关闭行为:两个选项排一行 */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-block-start: 12px; }
  .choice {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
    &:hover { border-color: #c3c8d0; }
    &:has(input:checked) { border-color: var(--data-hue); background: #f5f8fe; }
    & input { flex: none; accent-color: var(--data-hue); }
    & b { display: block; font-size: 14px; font-weight: 600; }
  }
  @media (width <= 560px) {
    .srow .grow { flex-basis: 100%; }
    .srow .actions { width: 100%; margin-inline-start: 0; }
    .choices { grid-template-columns: 1fr; }
  }

  /* 底部保存位 */
  .card > .btn { margin-block-start: 6px; }
}
</style>
</head>
<body>
<div class="card">
  <div class="topbar">
    <a class="back" href="/" aria-label="返回速查窗口">← 返回</a>
  </div>

  <h1>设置</h1>

  <section>
    <div class="row srow">
      <div class="grow">
        <div class="label">登录状态</div>
        <div class="hint">指程序自己保存的会话,与日常 Edge 无关;查出未登录时该行会给出「登录」按钮。</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="checkLogin" type="button">检查登录状态</button>
        <a class="btn btn-ghost" href="/login?from=settings">重新登录</a>
      </div>
    </div>

    <ul class="sources" id="sources"></ul>
    <div class="hint" id="checkMsg" role="status"></div>
  </section>

  <section>
    <div class="row">
      <div class="grow">
        <div class="label">自动检测</div>
        <div class="hint">每天自动抓取一次;发现临期或漏交任务时弹出 Windows 通知。</div>
      </div>
      <label class="switch" title="开启 / 关闭自动检测">
        <input type="checkbox" id="autoCheck">
        <span class="slider"></span>
      </label>
    </div>

    <div class="timeRow" id="timeRow">
      <label for="checkTime">检测时间</label>
      <input type="time" id="checkTime" value="09:00" step="60">
      <span class="hint">由 Windows 计划任务执行,程序没打开也会按时检测。</span>
    </div>
  </section>

  <section>
    <div class="label">关闭窗口时</div>

    <div class="choices">
      <label class="choice">
        <input type="radio" name="closeBehavior" value="tray">
        <span><b>最小化到托盘</b></span>
      </label>
      <label class="choice">
        <input type="radio" name="closeBehavior" value="exit">
        <span><b>退出程序</b></span>
      </label>
    </div>
  </section>

  <button class="btn btn-primary btn-block btn-lg" id="save" type="button">保存设置</button>
  <div class="status" id="status" role="status"></div>
</div>

<script>
"use strict";
// 窗口存活探测:设置页也算一个窗口,关闭它不会误触发“全部关闭”
new EventSource('/api/live');

const autoEl = document.getElementById('autoCheck');
const timeEl = document.getElementById('checkTime');
const timeRow = document.getElementById('timeRow');
const saveBtn = document.getElementById('save');
const statusEl = document.getElementById('status');

function showStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}

// ---------------------------------------------------------------- 登录状态
// 三路数据源:乐学必需,延河/智慧树可选(未登录只是少一块数据)
const SOURCES = [
  { key: 'eclass', name: '乐学', tag: '必需', desc: '作业 · 测验 · 考试' },
  { key: 'aita', name: '延河课堂', tag: '可选', desc: '课程关闭时间' },
  { key: 'zhs', name: '智慧树', tag: '可选', desc: '共享课 · 智慧课程' },
];
const LOGIN_MAX_MS = 12 * 60 * 1000; // 单源登录窗口最长等 10 分钟,再留点余量

const checkBtn = document.getElementById('checkLogin');
const sourcesEl = document.getElementById('sources');
const checkMsgEl = document.getElementById('checkMsg');
let pollTimer = null;
let pollDeadline = 0;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// 只给「多久以前」的粗粒度,不暴露具体检查时刻
function relTime(iso) {
  const t = Date.parse(iso || '');
  if (!t) return '';
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + ' 小时前';
  return Math.round(hours / 24) + ' 天前';
}

function setChecking(on) {
  checkBtn.disabled = on;
  checkBtn.innerHTML = on
    ? '<span class="spinner"></span>检查中…'
    : '检查登录状态';
}

// 提示只活 3 分钟(登录/检查进行中除外):避免隔天打开页面还挂着旧话
function freshMessage(st) {
  if (!st.message) return '';
  const t = Date.parse(st.message_at || '');
  const age = t ? Date.now() - t : Infinity;
  return st.source_login || st.checking || age < 3 * 60000 ? st.message : '';
}

function renderLoginState(st) {
  if (!st) return;
  const srcs = st.sources || {};
  const busyKey = st.source_login ? (st.source_login_key || '') : '';
  const frozen = !!st.checking || !!st.source_login;

  sourcesEl.innerHTML = SOURCES.map(s => {
    const v = srcs[s.key];
    let cls = 'unknown';
    let state = '未检查过';
    let why = '点「检查登录状态」获取最新结论';
    if (v) {
      cls = v.ok ? 'ok' : 'bad';
      state = v.ok ? '已登录' : '未登录';
      why = (v.why || s.desc) + (v.checked_at ? ' · ' + relTime(v.checked_at) + '检查' : '');
    }
    if (busyKey === s.key) { cls = 'pending'; state = '等待登录…'; }

    // 查出未登录(或正在等这一路登录)时,就地给一个「登录」按钮:
    // 只开这一个平台的登录窗口,不走完整登录向导
    let loginBtn = '';
    if (busyKey === s.key) {
      loginBtn = '<button class="btn btn-ghost s-login" type="button" disabled>'
        + '<span class="spinner"></span>登录中</button>';
    } else if (v && !v.ok) {
      loginBtn = '<button class="btn btn-ghost s-login" type="button" data-src="' + s.key + '"'
        + (frozen ? ' disabled' : '') + '>登录</button>';
    }

    return '<li class="source ' + cls + '">'
      + '<span class="dot" aria-hidden="true"></span>'
      + '<div class="s-main">'
      + '<div class="s-name">' + s.name + '<span class="s-tag">' + s.tag + '</span></div>'
      + '<div class="s-why">' + esc(why) + '</div>'
      + '</div>'
      + '<div class="s-side"><span class="s-state">' + esc(state) + '</span>' + loginBtn + '</div>'
      + '</li>';
  }).join('');

  checkBtn.disabled = frozen;
  checkBtn.innerHTML = st.checking
    ? '<span class="spinner"></span>检查中…'
    : '检查登录状态';
  checkMsgEl.textContent = freshMessage(st);
}

async function fetchLoginState() {
  return await fetch('/api/login-state', { cache: 'no-store' }).then(r => r.json());
}

async function loadLoginState() {
  try {
    const st = await fetchLoginState();
    renderLoginState(st);
    if (st.checking || st.source_login) startPoll();
  } catch (e) {
    checkMsgEl.textContent = '读取登录状态失败,请关闭窗口后重新打开程序';
  }
}

function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// 检查(约 20 秒)与单源登录(可见窗口最长等 10 分钟)共用一条轮询
function startPoll() {
  if (pollTimer) return;
  pollDeadline = Date.now() + LOGIN_MAX_MS;
  pollTimer = setInterval(async () => {
    let st;
    try {
      st = await fetchLoginState();
    } catch (e) {
      return; // 偶发失败下一轮再试
    }
    renderLoginState(st);
    if (!st.checking && !st.source_login) {
      stopPoll();
      return;
    }
    if (Date.now() > pollDeadline) {
      stopPoll();
      checkMsgEl.textContent = '等待超时:可以关掉弹出的 Edge 窗口后重试';
      loadLoginState();
    }
  }, 1200);
}

checkBtn.addEventListener('click', async () => {
  setChecking(true);
  checkMsgEl.textContent = '正在起无窗口浏览器逐个探测,约 20 秒…';
  try {
    const res = await fetch('/api/check-login', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      setChecking(false);
      checkMsgEl.textContent = data.error || '检查启动失败,请稍后重试';
      return;
    }
    renderLoginState(data);
    startPoll();
  } catch (e) {
    setChecking(false);
    checkMsgEl.textContent = '无法连接本地服务,请关闭窗口后重新打开程序';
  }
});

// 单源登录:只给这一路开可见窗口等用户登录(事件委托,列表是动态渲染的)
sourcesEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-src]');
  if (!btn || btn.disabled) return;
  const key = btn.dataset.src;
  const name = (SOURCES.find(s => s.key === key) || {}).name || key;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>启动中';
  checkMsgEl.textContent = '正在打开「' + name + '」登录窗口…';
  try {
    const res = await fetch('/api/source-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: key }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      checkMsgEl.textContent = data.error || '登录启动失败,请稍后重试';
      loadLoginState();
      return;
    }
    renderLoginState(data);
    startPoll();
  } catch (err) {
    checkMsgEl.textContent = '无法连接本地服务,请关闭窗口后重新打开程序';
    loadLoginState();
  }
});

function syncTimeState() {
  const on = autoEl.checked;
  timeEl.disabled = !on;
  timeRow.classList.toggle('off', !on);
}

autoEl.addEventListener('change', syncTimeState);

async function load() {
  try {
    const s = await fetch('/api/settings', { cache: 'no-store' }).then(r => r.json());
    autoEl.checked = !!s.auto_check;
    if (s.check_time) timeEl.value = s.check_time;
    const radio = document.querySelector('input[name="closeBehavior"][value="' +
      (s.close_behavior === 'exit' ? 'exit' : 'tray') + '"]');
    if (radio) radio.checked = true;
  } catch (e) {
    showStatus('读取设置失败,请关闭窗口后重新打开程序。', 'err');
  }
  syncTimeState();
}

saveBtn.addEventListener('click', async () => {
  const radio = document.querySelector('input[name="closeBehavior"]:checked');
  const body = {
    auto_check: autoEl.checked,
    check_time: timeEl.value || '09:00',
    close_behavior: radio ? radio.value : 'tray'
  };
  saveBtn.disabled = true;
  saveBtn.textContent = '正在保存…';
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showStatus('✗ ' + (data.error || '保存失败'), 'err');
    } else {
      showStatus('✓ 设置已保存' + (data.auto_check
        ? ',每天 ' + data.check_time + ' 自动检测'
        : ',自动检测已关闭'), 'ok');
    }
  } catch (e) {
    showStatus('✗ 无法连接本地服务,请关闭窗口后重新打开程序。', 'err');
  }
  saveBtn.disabled = false;
  saveBtn.textContent = '保存设置';
});

load();
loadLoginState();
</script>
</body>
</html>
