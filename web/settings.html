<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 延河课堂 DDL</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icon256.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/app.css">
<style>
@layer page {
  body {
    display: grid; grid-template-columns: minmax(0, 600px); justify-content: center;
    align-content: safe start; min-height: 100dvh; padding: 32px 24px 48px;
  }
  .card { width: 100%; border-radius: 12px; padding: 32px 36px 28px; }

  .topbar { display: flex; align-items: center; margin-block-end: 16px; }
  .back {
    display: inline-flex; align-items: center; gap: 5px;
    height: 30px; padding-inline: 12px;
    background: var(--surface); border: 1px solid var(--control); border-radius: 8px;
    font-size: 13px; line-height: 1; text-decoration: none;
    transition: background-color .12s ease, border-color .12s ease;
    &:hover { background: #f5f6f8; border-color: #c3c8d0; }
  }

  h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }

  section {
    padding-block: 22px; border-block-start: 1px solid var(--border);
    &:first-of-type { padding-block-start: 24px; border-block-start: none; }
  }
  .row { display: flex; align-items: flex-start; gap: 16px; }
  .row .grow { flex: 1; min-width: 0; }
  .label { font-size: 15px; font-weight: 600; line-height: 22px; }
  .hint { margin-block-start: 3px; color: var(--muted); font-size: 12px; line-height: 1.65; }

  /* 开关:隐藏原生 checkbox 的外观但保留焦点与键盘操作 */
  .switch {
    position: relative; flex: none; width: 46px; height: 26px; margin-block-start: 2px;
    & input { position: absolute; width: 0; height: 0; opacity: 0; }
    & .slider {
      position: absolute; inset: 0; border-radius: 999px;
      background: #cfd4db; transition: background .18s; cursor: pointer;
      &::before {
        content: ""; position: absolute; left: 3px; top: 3px;
        width: 20px; height: 20px; border-radius: 50%; background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .18s;
      }
    }
    & input:checked + .slider { background: var(--data-hue); }
    & input:checked + .slider::before { transform: translateX(20px); }
    & input:focus-visible + .slider { outline: 2px solid var(--data-hue); outline-offset: 2px; }
  }

  /* 固定检测时间:关闭自动检测时整体变灰,时间输入禁用 */
  .timeRow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    margin-block-start: 16px; padding: 12px 14px;
    background: #f7f8fa; border: 1px solid var(--border); border-radius: 8px;
    transition: opacity .18s;
    &.off { opacity: .45; }
    & label { font-size: 13px; font-weight: 600; }
    & .hint { margin: 0; }
  }
  input[type="time"] {
    height: 34px; padding-inline: 10px;
    background: #fff; border: 1px solid var(--control); border-radius: 7px;
    font-size: 14px;
    &:disabled { background: #f1f2f4; color: var(--faint); }
  }

  /* 关闭行为:两个选项排一行 */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-block-start: 12px; }
  .choice {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px;
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
    &:hover { border-color: #c3c8d0; }
    &:has(input:checked) { border-color: var(--data-hue); background: #f5f8fe; }
    & input { flex: none; accent-color: var(--data-hue); }
    & b { display: block; font-size: 14px; font-weight: 600; }
  }
  @media (width <= 520px) { .choices { grid-template-columns: 1fr; } }

  /* 底部保存位 */
  .card > .btn { margin-block-start: 6px; }
}
</style>
</head>
<body>
<div class="card">
  <div class="topbar">
    <a class="back" href="/" aria-label="返回速查窗口">← 返回</a>
  </div>

  <h1>设置</h1>

  <section>
    <div class="row">
      <div class="grow">
        <div class="label">自动检测</div>
        <div class="hint">每天自动抓取一次;发现临期或漏交任务时弹出 Windows 通知。</div>
      </div>
      <label class="switch" title="开启 / 关闭自动检测">
        <input type="checkbox" id="autoCheck">
        <span class="slider"></span>
      </label>
    </div>

    <div class="timeRow" id="timeRow">
      <label for="checkTime">检测时间</label>
      <input type="time" id="checkTime" value="09:00" step="60">
      <span class="hint">由 Windows 计划任务执行,程序没打开也会按时检测。</span>
    </div>
  </section>

  <section>
    <div class="label">关闭窗口时</div>

    <div class="choices">
      <label class="choice">
        <input type="radio" name="closeBehavior" value="tray">
        <span><b>最小化到托盘</b></span>
      </label>
      <label class="choice">
        <input type="radio" name="closeBehavior" value="exit">
        <span><b>退出程序</b></span>
      </label>
    </div>
  </section>

  <button class="btn btn-primary btn-block btn-lg" id="save" type="button">保存设置</button>
  <div class="status" id="status" role="status"></div>
</div>

<script>
"use strict";
// 窗口存活探测:设置页也算一个窗口,关闭它不会误触发“全部关闭”
new EventSource('/api/live');

const autoEl = document.getElementById('autoCheck');
const timeEl = document.getElementById('checkTime');
const timeRow = document.getElementById('timeRow');
const saveBtn = document.getElementById('save');
const statusEl = document.getElementById('status');

function showStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (cls || '');
}

function syncTimeState() {
  const on = autoEl.checked;
  timeEl.disabled = !on;
  timeRow.classList.toggle('off', !on);
}

autoEl.addEventListener('change', syncTimeState);

async function load() {
  try {
    const s = await fetch('/api/settings', { cache: 'no-store' }).then(r => r.json());
    autoEl.checked = !!s.auto_check;
    if (s.check_time) timeEl.value = s.check_time;
    const radio = document.querySelector('input[name="closeBehavior"][value="' +
      (s.close_behavior === 'exit' ? 'exit' : 'tray') + '"]');
    if (radio) radio.checked = true;
  } catch (e) {
    showStatus('读取设置失败,请关闭窗口后重新打开程序。', 'err');
  }
  syncTimeState();
}

saveBtn.addEventListener('click', async () => {
  const radio = document.querySelector('input[name="closeBehavior"]:checked');
  const body = {
    auto_check: autoEl.checked,
    check_time: timeEl.value || '09:00',
    close_behavior: radio ? radio.value : 'tray'
  };
  saveBtn.disabled = true;
  saveBtn.textContent = '正在保存…';
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showStatus('✗ ' + (data.error || '保存失败'), 'err');
    } else {
      showStatus('✓ 设置已保存' + (data.auto_check
        ? ',每天 ' + data.check_time + ' 自动检测'
        : ',自动检测已关闭'), 'ok');
    }
  } catch (e) {
    showStatus('✗ 无法连接本地服务,请关闭窗口后重新打开程序。', 'err');
  }
  saveBtn.disabled = false;
  saveBtn.textContent = '保存设置';
});

load();
</script>
</body>
</html>
