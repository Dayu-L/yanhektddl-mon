<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>延河课堂 DDL</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icon256.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@layer page {
  .page { max-width: 1148px; margin-inline: auto; padding-inline: 24px; }

  /* ============ 标题行 ============ */
  .titlebar {
    display: flex; align-items: flex-start; gap: 14px; padding-block-start: 36px;
    & .mark { flex: none; margin-block-start: 3px; }
    & .heading { min-width: 0; }
    & h1 { font-size: 24px; font-weight: 600; line-height: 30px; letter-spacing: -0.01em; }
  }
  .finding {
    max-width: 62ch; margin-block-start: 4px; color: var(--muted);
    &:empty { display: none; }
  }
  .stampbox {
    display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap;
    gap: 8px; margin-inline-start: auto; padding-block-start: 2px;
  }
  .stamp { color: var(--muted); font-size: 12px; margin-inline-end: 2px; }
  .stamp .num { color: var(--text); }

  /* ============ 数据源标签 / 筛选 ============ */
  .plat {
    display: inline-block; margin-inline-end: 6px; padding-inline: 6px;
    border-radius: 6px; font-size: 11px; line-height: 16px; vertical-align: 1px;
    background: #eef3fb; color: #3a5f9e;
    &.zhs { background: #eaf6ee; color: #2f7a4d; }
  }
  .filterbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px;
    /* 与标题行、下方栅格都要留呼吸:标题行本身无下边距 */
    margin-block: 22px var(--gap);
  }
  .chipgroup { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .chiplabel { color: var(--muted); font-size: 12px; margin-inline-end: 2px; }
  .chip {
    border: 1px solid var(--control); border-radius: 999px; background: transparent;
    padding: 4px 12px; color: var(--muted);
    font-family: inherit; font-size: 12px; line-height: 18px; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
    & .n { margin-inline-start: 4px; opacity: .65; }
    &:hover { border-color: var(--text); color: var(--text); }
    &:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    &[aria-pressed="true"] {
      background: var(--text); border-color: var(--text); color: #fff;
      & .n { opacity: .8; }
    }
  }
  .chip-clear { border-style: dashed; }
  .chip-zero { opacity: .5; &:hover { opacity: .8; } }

  /* ============ 登录失效横幅 ============ */
  .relogin {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin-block-end: var(--gap); padding: 10px 14px;
    background: var(--negative-bg); color: var(--negative-ink);
    border: 1px solid #f2c8c4; border-radius: var(--radius-control);
    font-size: 13px;
    & a { color: inherit; font-weight: 600; text-decoration: underline; }
  }

  /* ============ 栅格:732 + 24 + 344 = 1100 ============ */
  .grid {
    display: grid; grid-template-columns: 1fr; gap: var(--gap); align-items: start;
    margin-block-start: var(--gap);
    @media (width >= 1121px) {
      grid-template-columns: 732px 344px;
      /* 右轨无卡片(已完成/已忽略皆空)时收成居中单列,不留空列 */
      &:not(:has(> .col-rail:not([hidden]))) {
        grid-template-columns: minmax(0, 860px); justify-content: center;
      }
    }
  }
  .col-main, .col-rail { display: grid; gap: var(--gap); min-width: 0; }

  /* ============ 卡片 ============ */
  .card { border-radius: var(--radius-card); padding: 20px; }
  .cardhead {
    display: flex; align-items: baseline; gap: 8px; margin-block-end: 4px;
    & .dot {
      flex: none; align-self: center; width: 6px; height: 6px;
      border-radius: 50%; background: var(--negative);
    }
    & h2 { font-size: 16px; font-weight: 600; line-height: 24px; }
    & .count { color: var(--muted); font-size: 12px; }
    & .toggle {
      display: inline-flex; align-items: center; gap: 4px;
      margin-inline-start: auto; padding: 3px 4px;
      background: none; border: none; color: var(--muted);
      font-size: 12px; cursor: pointer;
      &:hover { color: var(--text); text-decoration: underline; }
    }
  }

  /* ============ 主卡:最近截止(屏幕的回答) ============ */
  .hero {
    padding: var(--pad);
    & .hero-top { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 20px; }
    & .hero-count {
      font-family: var(--mono); font-size: 36px; font-weight: 700;
      line-height: 40px; letter-spacing: -0.02em;
      color: var(--data-hue); white-space: nowrap;
    }
    & .hero-task { flex: 1; min-width: 0; }
    & .hero-meta { margin-block-start: 3px; color: var(--muted); font-size: 12px; }
    & .hero-note {
      margin-block-start: 16px; color: var(--muted); font-size: 12px;
      & a { color: var(--text); }
    }
  }
  .hero-title {
    display: inline-block; max-width: 100%; vertical-align: bottom;
    font-size: 18px; font-weight: 500; line-height: 26px; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    &:hover { text-decoration: underline; }
  }
  /* 空态/筛选空态的主标题:与 hero-title 同字号,但不是链接 */
  .hero-headline { font-size: 18px; font-weight: 500; line-height: 26px; }

  /* ============ 任务行 ============ */
  .rows { display: block; }
  .row {
    display: grid; grid-template-columns: 1fr 122px 104px; gap: 16px; align-items: center;
    /* 水平内边距 + 等量负外边距:文字仍与卡片边缘对齐,
       hover 描边与文字之间留出空隙,不压首字 */
    padding: 11px 10px; margin-inline: -10px;
    border-block-start: 1px solid var(--rule); border-radius: 6px;
    cursor: pointer;
    &:hover { outline: 1px solid var(--control); }
    & .r-main { min-width: 0; }
  }
  .rows > .r-item:first-child > .row { border-block-start: none; padding-block-start: 12px; }
  .r-title {
    display: block; max-width: 100%;
    font-size: 14px; font-weight: 500; line-height: 20px; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    &:hover { text-decoration: underline; }
  }
  .r-sub {
    margin-block-start: 2px; color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .r-when { text-align: right; }
  .r-date { font-size: 13px; }
  .r-left { margin-block-start: 1px; color: var(--muted); font-size: 12px; }
  .r-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  /* 图标按钮:行内动作(详情/打开/忽略)统一 28px 命中区 */
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    flex: none; width: 28px; height: 28px;
    background: none; border: none; border-radius: 6px;
    color: var(--muted); cursor: pointer; text-decoration: none;
    &:hover { background: var(--raised); color: var(--text); }
    &:focus-visible { outline-offset: 0; }
  }
  .r-detail {
    margin: 2px -10px 12px; padding: 12px 14px;
    background: #f4f5f7; border-radius: 8px;
    font-size: 13px; line-height: 1.7; color: var(--text);
  }
  /* 弱化行(已完成/已忽略):标题降级 */
  .muted-rows .r-title { color: var(--muted); font-weight: 400; }
  /* 右轨行:标题优先,单个动作位(已忽略→恢复;已完成→无动作) */
  .col-rail .row { grid-template-columns: 1fr 92px 28px; gap: 8px; }
  .col-rail .r-date { font-size: 12px; }

  /* ============ 页脚 ============ */
  .foot { padding: 40px 0 24px; color: var(--faint); font-size: 12px; text-align: center; }

  /* ============ 电话 ============ */
  @media (width <= 640px) {
    .page { padding-inline: 16px; }
    .titlebar { flex-wrap: wrap; padding-block-start: 24px; }
    .stampbox { width: 100%; margin-inline-start: 0; justify-content: flex-start; }
    .filterbar { gap: 6px 12px; margin-block-start: 16px; }
    .chip { padding: 3px 10px; }
    .hero {
      padding: 16px;
      & .hero-top { align-items: flex-start; }
      & .hero-count { font-size: 28px; line-height: 32px; }
      & .btn-primary { width: 100%; margin-block-start: 14px; }
    }
    /* 行点击即跳转,打开按钮隐藏;只留详情 + 忽略两个图标 */
    .row { grid-template-columns: 1fr 104px 64px; }
    .r-open { display: none; }
    .card { padding: 16px; }
  }
}
</style>
</head>
<body>
<div class="page">
  <header class="titlebar">
    <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1.5" y="1.5" width="23" height="23" rx="6" fill="#ffffff" stroke="#e6e6e6"/>
      <circle cx="13" cy="13" r="8" fill="none" stroke="#1d5fbf" stroke-width="1.8"/>
      <path d="M13 8.2 V13 L16.4 15.2" fill="none" stroke="#1d5fbf" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div class="heading">
      <h1>延河课堂 DDL</h1>
      <p class="finding" id="finding" role="status">正在加载数据…</p>
    </div>
    <div class="stampbox">
      <span class="stamp">数据截至 <span class="num" id="stampTime">—</span></span>
      <a class="btn btn-ghost" href="/settings" title="自动巡检与关闭窗口行为">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>设置</a>
      <button class="btn btn-ghost" id="refreshBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>刷新数据</button>
    </div>
  </header>

  <div class="relogin" id="reloginBar" hidden>
    登录状态已失效,新数据抓不下来了(本机已存数据不受影响)。
    <a href="/login?from=banner">重新登录 →</a>
  </div>

  <search class="filterbar" id="filters" hidden></search>

  <div class="grid">
    <main class="col-main" id="main"></main>
    <aside class="col-rail" id="rail"></aside>
  </div>

  <footer class="foot">延河课堂 × 乐学 × 智慧树 · 数据来自平台官方接口 · <span id="footAuto">自动巡检</span>,也可随时手动刷新</footer>
</div>

<script>
"use strict";
const EMBEDDED = /*__DATA__*/ null;

/* ---------- 工具 ---------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
const pad = n => (n < 10 ? "0" + n : "" + n);
const fmtDate = d => (pad(d.getMonth() + 1)) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
function fmtLeft(ms) {
  if (ms < 0) return "已过期";
  const m = Math.floor(ms / 60000);
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  if (d >= 1) return "剩 " + d + "天" + h + "时";
  if (h >= 1) return "剩 " + h + "时" + (m % 60) + "分";
  return "剩 " + m + "分";
}
function fmtLive(ms) {
  if (ms < 0) return "已过期";
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const hh = pad(Math.floor((s % 86400) / 3600));
  const mm = pad(Math.floor((s % 3600) / 60));
  const ss = pad(s % 60);
  return (d > 0 ? d + "天 " : "") + hh + ":" + mm + ":" + ss;
}
function parseEnd(iso) { return new Date(iso); }

/* ---------- 图标(内联 SVG,不依赖外网) ---------- */
const ICON_PATHS = {
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  chevD: '<path d="m6 9 6 6 6-6"/>',
  chevU: '<path d="m18 15-6-6-6 6"/>',
  chevrons: '<path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/>',
  eyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>',
  undo: '<path d="M3 12a9 9 0 1 0 9-9c-2.52 0-4.93 1-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'
};
const icon = (name, size) =>
  '<svg width="' + (size || 14) + '" height="' + (size || 14) +
  '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  ICON_PATHS[name] + "</svg>";

/* ---------- 渲染 ---------- */
let DATA = null;
// 两个正交的筛选维度,互不干扰:数据源(乐学/智慧树) × 任务类型(作业/考试·测验/话题讨论/问卷)
let FILTER_PLAT = "all";
let FILTER_KIND = "all";
const filterActive = () => FILTER_PLAT !== "all" || FILTER_KIND !== "all";
const PLAT_CLASS = { "智慧树": "plat zhs" };

// 数据源小标签:一眼看出这条任务来自乐学还是智慧树
const platTag = r => r && r.platform
  ? '<span class="' + (PLAT_CLASS[r.platform] || "plat") + '">' + esc(r.platform) + "</span>"
  : "";

function rowHTML(r, opts) {
  opts = opts || {};
  const mode = opts.mode || ""; // "" 待办行 / "ignored" 已忽略行 / "done" 已完成行
  const end = parseEnd(r.end);
  const desc = (r.desc || "").trim();
  let actions = "";
  if (mode === "ignored") {
    // 自动忽略(已过期超 48 小时)是计算得出的,恢复了也会再被忽略,不给按钮
    if (!r.auto) {
      actions = '<button class="iconbtn" type="button" data-unignore="' + esc(r.key) + '" aria-label="取消忽略" title="取消忽略">' + icon("undo", 14) + "</button>";
    }
  } else if (mode !== "done") {
    actions = (desc ? '<button class="iconbtn" type="button" data-detail aria-expanded="false" aria-label="展开任务说明" title="任务说明">' + icon("chevD", 15) + "</button>" : "")
      + '<a class="iconbtn r-open" href="' + esc(r.url) + '" target="_blank" rel="noopener" aria-label="在新标签页打开任务" title="打开任务页面">' + icon("ext", 14) + "</a>"
      + '<button class="iconbtn" type="button" data-ignore="' + esc(r.key) + '" aria-label="忽略此任务" title="忽略:不再提醒与统计">' + icon("eyeOff", 14) + "</button>";
  }
  // 行本身不是交互控件:标题链接负责键盘/读屏路径,整行只是鼠标捷径
  // (链接里再套按钮属于嵌套交互元素,role="link" + tabindex 会踩这条红线)
  let html = '<li class="r-item"><div class="row" data-url="' + esc(r.url) + '">'
    + '<div class="r-main">'
    + '<a class="r-title" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>'
    + '<div class="r-sub">' + platTag(r) + esc(r.course) + " · " + esc(r.kind) + (r.no_need ? " · 无需提交" : "") + '</div>'
    + '</div>'
    + '<div class="r-when"><div class="r-date num">' + fmtDate(end) + '</div>'
    + '<div class="r-left num">' + fmtLeft(end - Date.now()) + '</div></div>'
    + '<div class="r-actions">' + actions + "</div>"
    + "</div>";
  if (desc) {
    const body = esc(desc.length > 800 ? desc.slice(0, 800) + "……(完整说明见作业页)" : desc)
      .replace(/\n/g, "<br>");
    html += '<div class="r-detail" hidden>' + body + "</div>";
  }
  return html + "</li>";
}

function sectionHTML(id, title, rows, opts) {
  opts = opts || {};
  if (!rows.length) return ""; // 空分组整卡隐藏,页面只保留有内容的板块
  const key = opts.key || id;   // DATA 里的键(与 DOM id 不一定相同)
  const cap = opts.cap || 0;
  const shown = cap ? rows.slice(0, cap) : rows;
  const hidden = rows.length - shown.length;
  let html = '<section class="card" id="' + id + '"><div class="cardhead">'
    + (opts.dot ? '<span class="dot" aria-hidden="true"></span>' : "")
    + "<h2>" + esc(title) + '</h2><span class="count">' + rows.length + " 项</span>"
    + (hidden > 0 ? '<button class="toggle" type="button" data-more="' + key + '" data-target="' + id + '">' + icon("chevrons", 12) + "展开全部</button>" : "")
    + "</div>";
  html += '<ul class="rows' + (opts.rowClass ? " " + opts.rowClass : "") + '">';
  for (const r of shown) html += rowHTML(r, opts);
  html += "</ul></section>";
  return html;
}

function render() {
  renderFilters(DATA);
  const d = filterData(DATA, FILTER_PLAT, FILTER_KIND);
  const main = $("#main"), rail = $("#rail");
  const heroCand = (d.urgent || []).concat(d.week || [], d.later || [], d.unknown || []);
  const hero = heroCand.length ? heroCand.reduce((a, b) => (parseEnd(a.end) <= parseEnd(b.end) ? a : b)) : null;

  /* 标题行不再放概览小字(总量/分组/各数据源数量分别在筛选胶囊与卡片头里),
     该位置只给加载中/出错提示用;数据渲染成功就清空 */
  $("#finding").textContent = "";
  $("#stampTime").textContent = fmtStamp(d.fetched_at);

  /* 主列 */
  let html = "";
  if (!d.item_count && filterActive()) {
    // 只有「筛选导致空」才用筛选空态;真的没数据时仍走下面的常规空态
    main.innerHTML = filterEmptyHTML();
    rail.innerHTML = "";
    rail.hidden = true;
    tick();
    return;
  }
  if (hero) {
    const end = parseEnd(hero.end);
    const urgentOthers = (d.urgent || []).filter(r => r !== hero).length;
    html += '<section class="card hero"><div class="hero-top">'
      + '<div class="hero-count" id="heroCount" data-end="' + hero.end + '">—</div>'
      + '<div class="hero-task">'
      + '<a class="hero-title" href="' + esc(hero.url) + '" target="_blank" rel="noopener">' + esc(hero.title) + "</a>"
      + '<div class="hero-meta">' + platTag(hero) + esc(hero.course) + " · " + esc(hero.kind) + " · 截止 " + fmtDate(end) + "</div>"
      + "</div>"
      + '<a class="btn btn-primary" href="' + esc(hero.url) + '" target="_blank" rel="noopener">去完成 ' + icon("arrow", 15) + "</a>"
      + "</div>";
    if (urgentOthers > 0) html += '<div class="hero-note">另有 ' + urgentOthers + ' 项也在 3 天内截止,见下方列表</div>';
    html += "</section>";
  } else {
    html += '<section class="card hero"><div class="hero-top">'
      + '<div><div class="hero-headline">全部任务已完成</div>'
      + '<div class="hero-meta">下次巡检发现新任务会自动出现在这里</div></div></div></section>';
  }
  html += sectionHTML("missed", "已过期未提交", d.missed || [], { dot: true });
  html += sectionHTML("urgent", "3 天内截止", d.urgent || [], {});
  html += sectionHTML("week", "7 天内截止", d.week || [], {});
  html += sectionHTML("later", "更远期任务", d.later || [], { cap: 6 });
  html += sectionHTML("unknown", "提交状态未知", d.unknown || [], {});
  main.innerHTML = html;

  /* 右轨:已忽略(可恢复;自动忽略不可恢复) + 已完成;全空则隐藏整列 */
  let rh = sectionHTML("ignoredlist", "已忽略", d.ignored || [], {
    rowClass: "muted-rows", mode: "ignored", cap: 6, key: "ignored"
  });
  rh += sectionHTML("donelist", "已完成", d.done || [], { rowClass: "muted-rows", mode: "done", cap: 6, key: "done" });
  rail.innerHTML = rh;
  rail.hidden = !rh;

  tick();
}

/* ---------- 数据源 / 类型筛选 ---------- */
const ROW_GROUPS = ["missed", "urgent", "week", "later", "unknown", "done", "ignored"];
// 类型按这个顺序排,未知类型排后面(数据里出现新类型也不会乱序)
const KIND_ORDER = ["作业", "考试/测验", "话题讨论", "问卷"];

const rowsOf = d => ROW_GROUPS.reduce((acc, k) => acc.concat(d[k] || []), []);
const matchRow = (r, plat, kind) =>
  (plat === "all" || r.platform === plat) && (kind === "all" || r.kind === kind);

function platformsOf(d) {
  const seen = [];
  for (const r of rowsOf(d)) if (r.platform && seen.indexOf(r.platform) < 0) seen.push(r.platform);
  return seen;
}

function kindsOf(d) {
  const seen = [];
  for (const r of rowsOf(d)) if (r.kind && seen.indexOf(r.kind) < 0) seen.push(r.kind);
  const known = KIND_ORDER.filter(k => seen.indexOf(k) >= 0);
  return known.concat(seen.filter(k => KIND_ORDER.indexOf(k) < 0));
}

// 计数口径:每组的数字反映「另一个维度当前选择」下的条数 —— 点类型时能看到
// 各类型在当前来源下的量,点来源时能看到各来源在当前类型下的量,不会出现
// “选了智慧树、乐学的数字却还是全局值”这种自相矛盾。
function countRows(d, plat, kind) {
  return rowsOf(d).filter(r => matchRow(r, plat, kind)).length;
}

function filterData(d, plat, kind) {
  if (plat === "all" && kind === "all") return d;
  const out = { fetched_at: d.fetched_at };
  for (const k of ROW_GROUPS) out[k] = (d[k] || []).filter(r => matchRow(r, plat, kind));
  const courses = {};
  for (const k of ROW_GROUPS) for (const r of out[k]) courses[r.course] = 1;
  out.course_count = Object.keys(courses).length;
  out.item_count = countRows(d, plat, kind);
  return out;
}

// 某一维度只有一个取值时不渲染那一组:还没有智慧树数据、或清一色作业时,
// 多一排「全部/作业」只是噪音。
function renderFilters(d) {
  const box = $("#filters");
  if (!box) return;
  const plats = platformsOf(d), kinds = kindsOf(d);
  if (FILTER_PLAT !== "all" && plats.indexOf(FILTER_PLAT) < 0) FILTER_PLAT = "all";
  if (FILTER_KIND !== "all" && kinds.indexOf(FILTER_KIND) < 0) FILTER_KIND = "all";

  const chip = (attr, val, label, on, n) =>
    '<button class="chip' + (n === 0 && !on ? " chip-zero" : "") + '" type="button" ' + attr +
    '="' + esc(val) + '" aria-pressed="' + on + '">'
    + esc(label) + '<span class="n">' + n + "</span></button>";

  const groups = [];
  if (plats.length > 1) {
    let g = '<div class="chipgroup" role="group" aria-label="按数据源筛选"><span class="chiplabel">来源</span>'
      + chip("data-plat", "all", "全部", FILTER_PLAT === "all", countRows(d, "all", FILTER_KIND));
    for (const p of plats)
      g += chip("data-plat", p, p, FILTER_PLAT === p, countRows(d, p, FILTER_KIND));
    groups.push(g + "</div>");
  }
  if (kinds.length > 1) {
    let g = '<div class="chipgroup" role="group" aria-label="按任务类型筛选"><span class="chiplabel">类型</span>'
      + chip("data-kind", "all", "全部", FILTER_KIND === "all", countRows(d, FILTER_PLAT, "all"));
    for (const k of kinds)
      g += chip("data-kind", k, k, FILTER_KIND === k, countRows(d, FILTER_PLAT, k));
    groups.push(g + "</div>");
  }
  if (!groups.length) { box.hidden = true; box.innerHTML = ""; return; }

  groups.push('<button class="chip chip-clear" type="button" data-clear-filters'
    + (filterActive() ? "" : " hidden") + '>清除筛选</button>');
  box.hidden = false;
  box.innerHTML = groups.join("");
}

// 筛选后一条不剩时的空态:说清当前条件,并给一条退路
function filterEmptyHTML() {
  const cond = [FILTER_PLAT === "all" ? "" : FILTER_PLAT, FILTER_KIND === "all" ? "" : FILTER_KIND]
    .filter(Boolean).join(" · ");
  return '<section class="card hero"><div class="hero-top"><div>'
    + '<div class="hero-headline">当前筛选下没有任务</div>'
    + '<div class="hero-meta">筛选条件:' + esc(cond) + '。换个条件,或点上方「清除筛选」看全部。</div>'
    + "</div></div></section>";
}

function fmtStamp(iso) {
  if (!iso) return "—";
  const d = parseEnd(iso);
  return (pad(d.getMonth() + 1)) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function tick() {
  const el = $("#heroCount");
  if (el) el.textContent = fmtLive(parseEnd(el.dataset.end) - Date.now());
}
setInterval(tick, 1000);

function expandMore(btn) {
  const key = btn.dataset.more;
  const all = DATA && DATA[key];
  const keep = document.getElementById(btn.dataset.target || key);
  if (!all || !keep) return;
  const mode = key === "ignored" ? "ignored" : key === "done" ? "done" : "";
  const rowsEl = keep.querySelector(".rows");
  if (rowsEl) rowsEl.innerHTML = all.map(r => rowHTML(r, { mode: mode })).join("");
  const count = keep.querySelector(".count");
  if (count) count.textContent = all.length + " 项";
  btn.remove();
}

/* ---------- 忽略 / 恢复 ---------- */
async function postIgnore(key, ignored) {
  try {
    const res = await fetch("/api/ignore", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, ignored: ignored })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    await load(); // 重新拉数据并渲染,分组计数即时更新
  } catch (e) {
    $("#finding").textContent = "忽略状态保存失败,请稍后重试。";
  }
}

/* 事件委托:行点击、回车跳转、展开/详情/忽略按钮 —— DOM 重建后依然生效,无需重绑 */
function toggleDetail(btn) {
  const row = btn.closest(".row");
  const panel = row && row.nextElementSibling;
  if (!panel || !panel.classList.contains("r-detail")) return;
  const open = !panel.hidden;
  panel.hidden = open;
  btn.setAttribute("aria-expanded", String(!open));
  btn.setAttribute("aria-label", open ? "展开任务说明" : "收起任务说明");
  btn.innerHTML = icon(open ? "chevD" : "chevU", 15);
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-plat], .chip[data-kind]");
  if (chip) {
    // 再点一次已选中的胶囊 = 取消该项筛选(回到全部)
    if (chip.dataset.plat !== undefined) {
      FILTER_PLAT = chip.dataset.plat === FILTER_PLAT ? "all" : chip.dataset.plat;
    } else {
      FILTER_KIND = chip.dataset.kind === FILTER_KIND ? "all" : chip.dataset.kind;
    }
    render();
    return;
  }
  if (e.target.closest("[data-clear-filters]")) {
    FILTER_PLAT = "all";
    FILTER_KIND = "all";
    render();
    return;
  }
  const ig = e.target.closest("[data-ignore]");
  if (ig) { postIgnore(ig.dataset.ignore, true); return; }
  const un = e.target.closest("[data-unignore]");
  if (un) { postIgnore(un.dataset.unignore, false); return; }
  const btn = e.target.closest("[data-more]");
  if (btn) { expandMore(btn); return; }
  const det = e.target.closest("[data-detail]");
  if (det) { toggleDetail(det); return; }
  const row = e.target.closest(".row");
  if (row && !e.target.closest("a") && !e.target.closest("button"))
    window.open(row.dataset.url, "_blank", "noopener");
});
/* ---------- 刷新 ---------- */
async function load() {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (e) {
    if (EMBEDDED) { DATA = EMBEDDED; render(); }
    else $("#finding").textContent = "无法加载数据,请稍后点[刷新数据]重试。";
  }
}

const refreshBtn = $("#refreshBtn");
const refreshLabel = refreshBtn.innerHTML; // 含刷新图标
refreshBtn.addEventListener("click", async () => {
  refreshBtn.disabled = true;
  refreshBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>抓取中…';
  $("#stampTime").textContent = "抓取中…";
  try {
    await fetch("/api/refresh", { method: "POST" });
    for (;;) {
      await new Promise(res => setTimeout(res, 3000));
      const st = await fetch("/api/status", { cache: "no-store" }).then(r => r.json());
      if (!st.running) break;
    }
    await load();
    checkLogin();
  } catch (e) {
    $("#finding").textContent = "刷新失败,请稍后点[刷新数据]重试。";
  }
  refreshBtn.disabled = false;
  refreshBtn.innerHTML = refreshLabel;
});

// 窗口存活探测:服务凭所有窗口的这条长连接判断"还有人在用";
// 关闭后是否退出由设置页的「关闭窗口时」决定。
new EventSource('/api/live');

// 登录失效横幅:保温 ping / 刷新探明会话失效时提示重登。
// 状态本身由服务端维护,这里每 5 分钟对一次(保温 ping 也是分钟级)
async function checkLogin() {
  try {
    const st = await fetch("/api/status", { cache: "no-store" }).then(r => r.json());
    document.getElementById("reloginBar").hidden = !st.login_required;
  } catch (e) {}
}
checkLogin();
setInterval(checkLogin, 5 * 60 * 1000);

// 页脚展示当前自动巡检设置
fetch('/api/settings', { cache: 'no-store' }).then(r => r.json()).then(s => {
  const el = document.getElementById('footAuto');
  if (!el) return;
  el.textContent = s.auto_check ? ('每天 ' + s.check_time + ' 自动巡检') : '自动巡检已关闭';
}).catch(() => {});

if (EMBEDDED) { DATA = EMBEDDED; render(); }
load();
</script>
</body>
</html>
